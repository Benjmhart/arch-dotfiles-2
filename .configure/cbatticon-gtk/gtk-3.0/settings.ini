# Icon theme for cbatticon ONLY. .xinitrc points XDG_CONFIG_HOME here for that
# one process; nothing else reads this file.
#
# Adwaita's battery icons are symbolic SVGs. GTK draws a symbolic icon's body in
# the theme foreground colour, which in a tray icon comes out black, and
# stalonetray's background is "#000000" -- so the battery was invisible and only
# the 3px green charge bar of the icon's .success path ever showed.
# AdwaitaLegacy ships real 16x16 PNGs instead, which are pixbufs and are not
# recoloured. It is already installed (adwaita-icon-theme depends on it).
[Settings]
gtk-icon-theme-name=AdwaitaLegacy
