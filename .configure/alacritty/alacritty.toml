# Keyboard bindings stripped 2026-08-01 (station-maintenance beast-arch task 12).
#
# This file previously carried 103 bindings, 94 of them `chars = "..."` stanzas
# re-emitting legacy xterm escape sequences for the arrows, F1-F12, Home, End,
# PageUp/PageDown, Insert, Delete, Backspace, Shift-Tab and Shift-Return.
#
# Alacritty 0.17 encodes all of those itself, and its encoder is protocol-aware:
# legacy sequences when the application has asked for nothing, CSI-u when the
# application has enabled the Kitty keyboard protocol. A `chars` binding runs
# BEFORE that encoder and hands over a fixed byte string carrying no modifier
# information -- which is why herdr and Claude Code could not tell Enter from
# Shift+Enter. Alacritty's own 137 default bindings contain exactly two `chars`
# entries, for Ctrl+L and Cmd+K; key encoding is not done with bindings.
#
# Also removed: Ctrl+Up / Ctrl+Down / Ctrl+Home bound to scroll actions. Those
# are not Alacritty defaults and they consumed the keys outright, so nothing
# downstream ever saw them. Scrolling lives on Shift+PageUp/PageDown/Home/End
# by default, which collides with nothing.
#
# Backup of the previous file: alacritty.toml.bak-2026-08-01

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control|Shift"

[general]
live_config_reload = true
working_directory = "None"

[mouse]
hide_when_typing = false


[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 10000
multiplier = 5

[selection]
save_to_clipboard = true
semantic_escape_chars = """,│`|:"' ()[]{}<>"""

[window]
decorations = "full"
dynamic_padding = false
startup_mode = "Windowed"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 0
y = 0

