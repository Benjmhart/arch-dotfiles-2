# fcitx5 ClassicUI — the candidate/conversion window.
# Added 2026-08-12.
#
# Two changes, and the second one is not cosmetic:
#
# 1. SIZE. The default is "Sans 10" for Font and MenuFont, "Sans Bold 10" for
#    TrayFont (the defaults are embedded in libclassicui.so). Font is the one
#    that governs the conversion window.
#
# 2. FAMILY — this is the important one. `fc-match "Sans:lang=ja"` on this box
#    resolves to **Noto Sans CJK KR**, the Korean variant, because all five Noto
#    CJK families are installed and fontconfig had no reason to prefer JP. Han
#    glyphs differ between the JP and KR variants for a fair number of characters
#    (直, 骨, 令, 今 among them), so Japanese was being rendered with Korean
#    letterforms. Naming the family explicitly sidesteps fontconfig ordering
#    entirely.
#
# Reload after editing with: fcitx5-remote -r

# Conversion / candidate window
Font="Noto Sans CJK JP 14"

# Context menus
MenuFont="Noto Sans CJK JP 12"

# Tray label
TrayFont="Noto Sans CJK JP Bold 10"
