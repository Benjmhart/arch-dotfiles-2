<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Han characters were rendering in Korean glyph forms.

  Cause: fontconfig's shipped /usr/share/fontconfig/conf.default/65-nonlatin.conf
  lists ONLY "Noto Sans CJK KR" as the CJK member of the sans-serif alias. Noto
  Sans CJK JP/SC/TC/HK are never named, so KR won every CJK lookup, including an
  explicit :lang=ja. Han unification means all five fonts cover the same
  codepoints with region-specific glyph shapes, so the text is "correct" and
  simply looks wrong.

  This file makes the per-language fonts win for their own language, and makes
  Japanese the default for text that carries no language tag.
-->
<fontconfig>

  <!--
    Untagged text: keep the Latin font FIRST, then fall through to the Japanese
    CJK font. Listing the CJK font alone here makes it win Latin too, and its
    Latin glyphs are not the ones in use elsewhere. Verified 2026-08-12: with
    only the CJK family named, "fc-match sans-serif" returned Noto Sans CJK JP
    for plain Latin.
  -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>

  <!-- Explicitly tagged text: give each language its own regional forms. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>

</fontconfig>
