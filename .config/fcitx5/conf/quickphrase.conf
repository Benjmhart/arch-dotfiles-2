# Quick Phrase's built-in triggers are Super+grave AND Super+semicolon (read from
# the running fcitx5 over D-Bus, 2026-10-01). Super+grave is the input-method
# trigger in ../config [Hotkey/TriggerKeys], and with this file absent Quick
# Phrase took the key first: Super+` opened Quick Phrase instead of switching to
# hiragana, on beast-arch and carbon both. Keep only the other default.
[TriggerKey]
0=Super+semicolon
