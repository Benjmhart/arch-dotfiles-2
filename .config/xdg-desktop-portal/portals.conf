# xmonad sets no XDG_CURRENT_DESKTOP, and xdg-desktop-portal-gtk declares
# UseIn=gnome, so without this file no backend is chosen and the Settings
# interface (org.freedesktop.appearance color-scheme) does not exist. Electron
# apps -- Rambox -- then see "light" whatever gsettings says.
#
# In ~/.config, NOT $XDG_CONFIG_HOME: the portal is started by the systemd user
# manager, whose environment has no XDG_CONFIG_HOME.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
# The file chooser is yazi in Alacritty (xdg-desktop-portal-termfilechooser; its config is in
# ~/.config/xdg-desktop-portal-termfilechooser/). Vivaldi, Chromium and Rambox ask the portal.
# Remove this line to get GTK's dialog back. station-maintenance beast-arch task 72.
org.freedesktop.impl.portal.FileChooser=termfilechooser
